<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Smart Ferry Dashboard</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%2309090B%22/><circle cx=%2250%22 cy=%2250%22 r=%2220%22 fill=%22%23E92D2D%22/></svg>">

  <meta name="theme-color" id="theme-color-meta" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: light dark;
      
      --bg: #09090B;
      --surface: #18181B;
      --border: #27272A;
      --border-focus: #3F3F46;
      
      --text-main: #F4F4F5;
      --text-sec: #A1A1AA;
      --text-muted: #71717A;
      
      --accent: #E92D2D;
      --accent-muted: rgba(233, 45, 45, 0.15);
      
      --track-bg: #27272A;
      --dot-grid: radial-gradient(circle, #1F1F1F 1px, transparent 1px);
    }

    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        
        --bg: #F5F5F5;
        --surface: #FFFFFF;
        --border: #D4D4D4;
        --border-focus: #A3A3A3;
        
        --text-main: #000000;
        --text-sec: #555555;
        --text-muted: #888888;
        
        --accent: #D02121;
        --accent-muted: rgba(208, 33, 33, 0.1);
        
        --track-bg: #E5E5E5;
        --dot-grid: radial-gradient(circle, #DDDDDD 1px, transparent 1px);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    /* NATIVE BROWSER SCROLL LOCK - Prevents URL bar stretching */
    html, body {
      width: 100%;
      height: 100vh; /* Fallback */
      height: calc(var(--vh, 1vh) * 100);
      margin: 0;
      padding: 0;
      overflow: hidden; 
      background-color: var(--bg); 
      transition: background-color 0.3s ease;
    }

    .app-wrapper {
      position: absolute;
      inset: 0; 
      height: calc(var(--vh, 1vh) * 100);
      overflow-y: auto; 
      overscroll-behavior-y: none; 
      display: flex;
      justify-content: center;
    }

    body {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      color: var(--text-main);
      background-image: var(--dot-grid);
      background-size: 16px 16px;
      background-position: center top;
    }

    /* Subtle Hardware Loading Screen */
    #app-loader {
      position: fixed; inset: 0; background: var(--bg); z-index: 9999;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      gap: 16px; transition: opacity 0.4s ease;
      background-image: var(--dot-grid);
      background-size: 16px 16px;
    }
    .loader-dot {
      width: 12px; height: 12px; background: var(--accent); border-radius: 50%;
      box-shadow: 0 0 16px var(--accent-muted);
      animation: pulseLoader 0.9s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes pulseLoader { 0% { transform: scale(0.7); opacity: 0.4; } 100% { transform: scale(1.3); opacity: 1; } }
    .loader-text { font-size: 10px; font-weight: 700; color: var(--text-muted); letter-spacing: 2.5px; text-transform: uppercase; }

    .mono { font-family: 'Space Mono', monospace; }
    .caps { text-transform: uppercase; letter-spacing: 1px; }

    .app-container { 
      width: 100%; max-width: 420px; 
      display: flex; flex-direction: column; gap: 24px; 
      padding: 20px 16px 40px 16px; min-height: max-content;
    }

    /* Route Tabs */
    .tabs-container {
      display: flex; gap: 8px; padding: 4px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 100px;
    }
    .tab {
      flex: 1; text-align: center; padding: 12px 0;
      font-size: 12px; font-weight: 700; color: var(--text-muted);
      border-radius: 100px; cursor: pointer; transition: all 0.2s;
    }
    .tab.active { background: var(--text-main); color: var(--bg); }

    /* 3-Column Telemetry Grid */
    .telemetry { 
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: flex-end; 
      padding: 0 4px 12px 4px; border-bottom: 1px solid var(--border);
    }
    .gps-block { display: flex; align-items: center; gap: 8px; justify-content: flex-start;}
    .gps-status { font-size: 10px; font-weight: 700; color: var(--text-muted); letter-spacing: 1.5px;}
    .gps-indicator { width: 8px; height: 8px; background: var(--border); border-radius: 50%; }
    .gps-indicator.active { background: var(--accent); box-shadow: 0 0 8px var(--accent-muted); animation: blink 2s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
    
    .weather-block { font-size: 9px; font-weight: 700; color: var(--text-sec); letter-spacing: 1px; text-align: center; white-space: nowrap;}
    
    .clock-block { display: flex; align-items: baseline; gap: 8px; justify-content: flex-end; }
    .clock-date { font-size: 10px; font-weight: 700; color: var(--text-muted); letter-spacing: 1.5px;}
    .clock-time { font-size: 15px; font-weight: 700; color: var(--text-main); letter-spacing: -0.5px;}

    .anim-layer { display: flex; flex-direction: column; flex-grow: 1;}

    /* Main Card */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; display: flex; flex-direction: column;
      transition: border-color 0.3s; position: relative;
    }
    body.state-transit .card { border-color: var(--accent); box-shadow: 0 8px 32px var(--accent-muted); }

    .card-top { 
      display: flex; justify-content: space-between; align-items: flex-start; 
      font-size: 11px; font-weight: 700; color: var(--text-sec); 
      padding: 24px 24px 16px 24px;
    }
    
    #card-status-label { transition: color 0.3s ease; }
    #transit-route-label { display: none; font-size: 8px; color: var(--text-muted); letter-spacing: 1px; margin-top: 4px; }

    .time-flex { 
      display: flex; justify-content: space-between; align-items: flex-end; 
      padding: 0 24px 24
